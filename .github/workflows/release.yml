name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      velopackVersion: ${{ steps.version.outputs.velopackVersion }}
      assemblyVersion: ${{ steps.version.outputs.assemblyVersion }}
      fileVersion: ${{ steps.version.outputs.fileVersion }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        env:
          RAW_REF_NAME: ${{ github.ref_name }}
          RAW_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$RAW_REF_TYPE" == "tag" ]]; then
            VERSION="$RAW_REF_NAME"
          elif [[ "$RAW_REF_NAME" == "master" ]]; then
            # Manual runs from master get a date-based version.
            VERSION="v$(date -u +'%Y.%-m%-d.0')"
          else
            echo "::error::Run a manual release from master, or trigger the workflow by pushing a version tag."
            exit 1
          fi

          SEMVER="${VERSION#v}"

          # .NET AssemblyVersion/FileVersion use four numeric components.
          NUMERIC="${SEMVER%%-*}"
          NUMERIC="${NUMERIC%%+*}"
          PARTS="$(awk -F. '{print NF}' <<< "$NUMERIC")"

          if [[ "$PARTS" -eq 1 ]]; then
            NUMERIC="${NUMERIC}.0.0.0"
          fi
          if [[ "$PARTS" -eq 2 ]]; then
            NUMERIC="${NUMERIC}.0.0"
          fi
          if [[ "$PARTS" -eq 3 ]]; then
            NUMERIC="${NUMERIC}.0"
          fi

          # Velopack package versions use three numeric components.
          VELOPACK_VERSION="$(awk -F. '{print $1 "." $2 "." $3}' <<< "$NUMERIC")"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "velopackVersion=$VELOPACK_VERSION" >> "$GITHUB_OUTPUT"
          echo "assemblyVersion=$NUMERIC" >> "$GITHUB_OUTPUT"
          echo "fileVersion=$NUMERIC" >> "$GITHUB_OUTPUT"

          echo "Computed version: $VERSION (semver: $SEMVER, Velopack: $VELOPACK_VERSION, assembly: $NUMERIC)"

  build:
    name: Build ${{ matrix.artifact-name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact-name: lazer-windows
            executable: 'lazer!.exe'
            channel: win

          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: lazer-linux
            executable: 'lazer!'
            channel: linux

          - os: macos-latest
            runtime: osx-arm64
            artifact-name: lazer-macos
            executable: 'lazer!'
            channel: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install --global vpk

      - name: Restore dependencies
        shell: bash
        run: |
          dotnet restore osu.Desktop/osu.Desktop.csproj \
            --runtime '${{ matrix.runtime }}' \
            --verbosity normal

      - name: Build and publish
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.semver }}
          APP_FILE_VERSION: ${{ needs.version.outputs.fileVersion }}
          APP_ASSEMBLY_VERSION: ${{ needs.version.outputs.assemblyVersion }}
          APP_INFORMATIONAL_VERSION: ${{ needs.version.outputs.version }}
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: |
          dotnet publish osu.Desktop/osu.Desktop.csproj \
            --self-contained \
            --runtime "$TARGET_RUNTIME" \
            --configuration Release \
            --output "publish/$TARGET_RUNTIME" \
            --no-restore \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            "-p:Version=$APP_VERSION" \
            "-p:FileVersion=$APP_FILE_VERSION" \
            "-p:AssemblyVersion=$APP_ASSEMBLY_VERSION" \
            "-p:InformationalVersion=$APP_INFORMATIONAL_VERSION"

      - name: Set executable permissions (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          PUBLISHED_EXECUTABLE: ${{ matrix.executable }}
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: chmod +x "publish/$TARGET_RUNTIME/$PUBLISHED_EXECUTABLE"

      - name: Create Velopack package
        shell: bash
        env:
          VELOPACK_VERSION: ${{ needs.version.outputs.velopackVersion }}
          TARGET_RUNTIME: ${{ matrix.runtime }}
          PUBLISHED_EXECUTABLE: ${{ matrix.executable }}
          VELOPACK_CHANNEL: ${{ matrix.channel }}
          RUNNER_OS_NAME: ${{ matrix.os }}
        run: |
          VPK_ARGS=(
            --packId 'lazer'
            --packVersion "$VELOPACK_VERSION"
            --packDir "publish/$TARGET_RUNTIME"
            --mainExe "$PUBLISHED_EXECUTABLE"
            --packTitle 'lazer!'
            --channel "$VELOPACK_CHANNEL"
          )

          if [[ "$RUNNER_OS_NAME" != "macos-latest" ]]; then
            VPK_ARGS+=(--icon 'osu.Desktop/lazer.ico')
          fi

          vpk pack "${VPK_ARGS[@]}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact-name }}
          path: Releases/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: lazer! ${{ needs.version.outputs.version }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
